description = "VibeStudio - Agentic Workflow with ADK (the learning center)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[db]==2.7.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "google-cloud-bigquery>=3.25",
    "greenlet>=3.5.5",
    "google-cloud-aiplatform>=1.163.0",
    "pillow>=10.0",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "opentelemetry-resourcedetector-gcp>=1.9.0a0,<2",
