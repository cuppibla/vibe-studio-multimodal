<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="p10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B7E70"/>
    </marker>
    <marker id="p10ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3C6247"/>
    </marker>
    <marker id="p10no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C0503C"/>
    </marker>
  </defs>
  <rect width="1180" height="540" fill="#FBF7F0"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#2B2320">The workflow you build</text>
  <text x="40" y="62" font-size="13" fill="#8B7E70">one graph, from an idea to a published clip · the label under each node names the step that adds it</text>

  <!-- START -->
  <circle cx="52" cy="150" r="19" fill="#C96442"/>
  <text x="52" y="154" font-size="10" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#FFFFFF" text-anchor="middle">START</text>

  <!-- row 1: the readers -->
  <path d="M71 143 C 84 120, 88 106, 88 106" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <path d="M71 150 L 88 150" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <path d="M71 157 C 84 180, 88 194, 88 194" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>

  <rect x="90" y="88" width="160" height="32" rx="9" fill="#EAF3EC" stroke="#4E7C5A" stroke-width="1.4"/>
  <text x="170" y="109" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">scan_trends</text>
  <rect x="90" y="134" width="160" height="32" rx="9" fill="#EAF3EC" stroke="#4E7C5A" stroke-width="1.4"/>
  <text x="170" y="155" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">read_backlog</text>
  <rect x="90" y="180" width="160" height="32" rx="9" fill="#EAF3EC" stroke="#4E7C5A" stroke-width="1.4"/>
  <text x="170" y="201" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">read_feedback</text>
  <text x="170" y="230" font-size="10.5" fill="#8B7E70" text-anchor="middle">function nodes · step 4, and step 7 for the third</text>

  <!-- join -->
  <path d="M250 104 C 274 104, 280 144, 298 148" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <path d="M250 150 L 298 150" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <path d="M250 196 C 274 196, 280 156, 298 152" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <rect x="300" y="134" width="160" height="32" rx="9" fill="#F3EDE4" stroke="#B08968" stroke-width="1.4"/>
  <text x="380" y="155" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">join_research</text>
  <text x="380" y="180" font-size="10.5" fill="#8B7E70" text-anchor="middle">waits for every reader</text>

  <!-- proposer -->
  <line x1="460" y1="150" x2="508" y2="150" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <rect x="510" y="134" width="160" height="32" rx="9" fill="#EFEAF7" stroke="#6D5BA5" stroke-width="1.4"/>
  <text x="590" y="155" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">propose_directions</text>
  <text x="590" y="180" font-size="10.5" fill="#8B7E70" text-anchor="middle">an agent node · 4 candidates</text>
  <text x="590" y="116" font-size="10.5" fill="#6D5BA5" text-anchor="middle">step 6 · before_model_callback reads Memory Bank</text>

  <!-- gate -->
  <line x1="670" y1="150" x2="718" y2="150" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <rect x="720" y="134" width="160" height="32" rx="9" fill="#FDF0DC" stroke="#C97B22" stroke-width="1.6"/>
  <text x="800" y="155" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">direction_gate</text>
  <text x="800" y="180" font-size="10.5" fill="#C97B22" text-anchor="middle">the run stops · you pick 1 to 4</text>

  <!-- persist -->
  <line x1="880" y1="150" x2="928" y2="150" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <rect x="930" y="134" width="160" height="32" rx="9" fill="#EAF3EC" stroke="#4E7C5A" stroke-width="1.4"/>
  <text x="1010" y="155" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">persist_direction</text>
  <text x="1010" y="180" font-size="10.5" fill="#8B7E70" text-anchor="middle">writes the direction to state</text>

  <!-- down to row 2 -->
  <path d="M1010 166 L 1010 384" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <text x="1022" y="280" font-size="10.5" fill="#8B7E70">step 5</text>

  <!-- row 2, right to left: policy_check -->
  <rect x="930" y="386" width="160" height="32" rx="9" fill="#FBE9E7" stroke="#C0503C" stroke-width="1.6"/>
  <text x="1010" y="407" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">policy_check</text>
  <text x="1010" y="432" font-size="10.5" fill="#8B7E70" text-anchor="middle">a router · policy_words.txt</text>

  <!-- routes -->
  <path d="M930 396 C 900 396, 890 372, 862 372" fill="none" stroke="#3C6247" stroke-width="1.5" marker-end="url(#p10ok)"/>
  <text x="896" y="360" font-size="10.5" font-weight="700" fill="#3C6247" text-anchor="middle">OK</text>
  <path d="M930 410 C 900 410, 890 440, 862 440" fill="none" stroke="#C0503C" stroke-width="1.5" marker-end="url(#p10no)"/>
  <text x="896" y="462" font-size="10.5" font-weight="700" fill="#C0503C" text-anchor="middle">BLOCK</text>

  <rect x="700" y="356" width="160" height="32" rx="9" fill="#EFEAF7" stroke="#6D5BA5" stroke-width="1.4"/>
  <text x="780" y="377" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">scripter</text>
  <text x="780" y="338" font-size="10.5" fill="#6D5BA5" text-anchor="middle">step 6 · after_agent_callback writes Memory Bank</text>
  <rect x="700" y="424" width="160" height="32" rx="9" fill="#EFEAF7" stroke="#6D5BA5" stroke-width="1.4"/>
  <text x="780" y="445" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">quarantine</text>
  <text x="780" y="472" font-size="10.5" fill="#8B7E70" text-anchor="middle">a task agent · rewrites the refused words</text>

  <!-- quarantine rejoins the scripter -->
  <path d="M700 440 C 664 440, 664 372, 698 372" fill="none" stroke="#6D5BA5" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#p10)"/>
  <text x="644" y="408" font-size="10.5" fill="#6D5BA5" text-anchor="middle">cleaned</text>

  <!-- render desk -->
  <path d="M700 372 L 662 372" fill="none" stroke="#8B7E70" stroke-width="0" />
  <line x1="698" y1="356" x2="698" y2="356" stroke="none"/>
  <path d="M700 366 C 620 366, 580 400, 512 400" fill="none" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <rect x="350" y="386" width="160" height="32" rx="9" fill="#FDF0DC" stroke="#C97B22" stroke-width="1.6"/>
  <text x="430" y="407" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">render_desk</text>
  <text x="430" y="432" font-size="10.5" fill="#C97B22" text-anchor="middle">the run stops on a pending render</text>
  <text x="430" y="366" font-size="10.5" fill="#8B7E70" text-anchor="middle">step 8 · a long-running tool call to Veo</text>

  <!-- store video -->
  <line x1="350" y1="402" x2="302" y2="402" stroke="#8B7E70" stroke-width="1.4" marker-end="url(#p10)"/>
  <rect x="140" y="386" width="160" height="32" rx="9" fill="#EAF3EC" stroke="#4E7C5A" stroke-width="1.4"/>
  <text x="220" y="407" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320" text-anchor="middle">store_video</text>
  <text x="220" y="432" font-size="10.5" fill="#8B7E70" text-anchor="middle">the clip, once it is delivered</text>

  <!-- footer -->
  <line x1="40" y1="500" x2="1140" y2="500" stroke="#E4DCD1"/>
  <text x="40" y="522" font-size="11.5" fill="#8B7E70">The graph stops twice: for your pick, and for the render. Both resume with one function_response carrying the id of the call that stopped it.</text>
</svg>
