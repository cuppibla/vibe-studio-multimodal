<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B7E70"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#FBF7F0"/>
  <text x="34" y="40" font-size="20" font-weight="700" fill="#2B2320">Vibe Studio: what runs where</text>
  <text x="34" y="60" font-size="13" fill="#8B7E70">one repository, one learning center, and the GEAP services the graph calls</text>

  <!-- the learning center -->
  <rect x="30" y="86" width="278" height="256" rx="16" fill="#FFFFFF" stroke="#4E7C5A" stroke-width="2"/>
  <text x="50" y="114" font-size="14" font-weight="700" fill="#3C6247">the learning center</text>
  <text x="50" y="132" font-size="11.5" fill="#8B7E70">your browser · localhost:4600</text>
  <line x1="50" y1="144" x2="288" y2="144" stroke="#E4DCD1"/>
  <text x="50" y="168" font-size="12.5" fill="#2B2320">the step pages, 1 to 10</text>
  <text x="50" y="194" font-size="12.5" fill="#2B2320">an editor that writes real files</text>
  <text x="50" y="220" font-size="12.5" fill="#2B2320">verify panels that read what ran</text>
  <text x="50" y="246" font-size="12.5" fill="#2B2320">the ADK development UI, embedded</text>
  <text x="50" y="272" font-size="12.5" fill="#2B2320">buttons for the console commands</text>
  <text x="50" y="306" font-size="11.5" fill="#8B7E70">nothing here is simulated: every</text>
  <text x="50" y="322" font-size="11.5" fill="#8B7E70">panel reads the files and sessions</text>

  <!-- edits / runs -->
  <line x1="308" y1="176" x2="356" y2="176" stroke="#8B7E70" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="332" y="168" font-size="11" fill="#8B7E70" text-anchor="middle">edits</text>
  <line x1="356" y1="234" x2="308" y2="234" stroke="#8B7E70" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="332" y="252" font-size="11" fill="#8B7E70" text-anchor="middle">events</text>

  <!-- your backend -->
  <rect x="358" y="86" width="278" height="256" rx="16" fill="#FFFFFF" stroke="#C96442" stroke-width="2"/>
  <text x="378" y="114" font-size="14" font-weight="700" fill="#A8492B">your backend</text>
  <text x="378" y="132" font-size="11.5" fill="#8B7E70">the repository you edit</text>
  <line x1="378" y1="144" x2="616" y2="144" stroke="#E4DCD1"/>
  <text x="378" y="166" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320">agent/graph.py</text>
  <text x="378" y="182" font-size="11" fill="#8B7E70">the workflow and its nodes</text>
  <text x="378" y="210" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320">agent/platform/</text>
  <text x="378" y="226" font-size="11" fill="#8B7E70">the GEAP clients and the plumbing</text>
  <text x="378" y="254" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320">stage0_prompt … stage6_video</text>
  <text x="378" y="270" font-size="11" fill="#8B7E70">one sandbox app per step</text>
  <text x="378" y="298" font-size="12" font-family="'SF Mono',Menlo,Consolas,monospace" fill="#2B2320">runs/sessions.db</text>
  <text x="378" y="314" font-size="11" fill="#8B7E70">every event, state key, pending call</text>

  <!-- calls -->
  <line x1="636" y1="205" x2="684" y2="205" stroke="#8B7E70" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="660" y="197" font-size="11" fill="#8B7E70" text-anchor="middle">calls</text>

  <!-- google cloud -->
  <rect x="686" y="86" width="284" height="256" rx="16" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="2"/>
  <text x="706" y="114" font-size="14" font-weight="700" fill="#3A5A87">Google Cloud</text>
  <text x="706" y="132" font-size="11.5" fill="#8B7E70">GEAP, in your own project</text>
  <line x1="706" y1="144" x2="950" y2="144" stroke="#E4DCD1"/>
  <text x="706" y="168" font-size="12.5" font-weight="700" fill="#2B2320">Gemini</text>
  <text x="706" y="184" font-size="11" fill="#8B7E70">the agent nodes, steps 3 to 5</text>
  <text x="706" y="212" font-size="12.5" font-weight="700" fill="#2B2320">Memory Bank</text>
  <text x="706" y="228" font-size="11" fill="#8B7E70">the creator's taste, step 6</text>
  <text x="706" y="256" font-size="12.5" font-weight="700" fill="#2B2320">RAG Engine</text>
  <text x="706" y="272" font-size="11" fill="#8B7E70">the audience's comments, step 7</text>
  <text x="706" y="300" font-size="12.5" font-weight="700" fill="#2B2320">Veo</text>
  <text x="706" y="316" font-size="11" fill="#8B7E70">the render, step 8</text>

  <!-- the deploy -->
  <rect x="358" y="362" width="612" height="44" rx="12" fill="#F1F5F0" stroke="#4E7C5A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="378" y="382" font-size="12.5" font-weight="700" fill="#3C6247">step 9 · Cloud Run</text>
  <text x="378" y="398" font-size="11" fill="#8B7E70">the same graph, with an app in front of it, in one container</text>
  <line x1="497" y1="342" x2="497" y2="360" stroke="#8B7E70" stroke-width="1.5" marker-end="url(#a5)"/>
</svg>
